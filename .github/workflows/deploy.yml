# Сборка сайта команды при пуше в main — БЕЗ СЕКРЕТОВ И БЕЗ ШАГОВ CLOUDFLARE.
# Этот воркфлоу только СОБИРАЕТ сайт и отдаёт результат GitHub-артефактом `hov-site`. Публикует сайт сервер платформы
# HackOnVibe своим токеном: по сообщению «задание build готово» (вебхук workflow_job) он скачивает артефакт, строго
# проверяет файлы и выкладывает их в проект Pages с именем этого репозитория (modules/github/application/deploy-team-site.mjs).
# Секретов у репозитория команды нет, поэтому правка воркфлоу никому ничего не открывает; но файл управляется
# платформой и восстанавливается — правьте код приложения, а не его.
#
# АВТО-СБОРКА (§22 — пайплайн собирает САМ, без ручных per-repo переменных):
#   • детект приложения: package.json в КОРНЕ, иначе в первой подпапке (распакованный zip «app/»);
#   • есть package.json + скрипт "build" → CI ставит Node 20, `npm ci` (fallback `npm install`), `npm run build`;
#   • авто-детект выхлопа: первая из dist / build / out / .output/public / .next-export с index.html;
#   • нет package.json → в артефакт кладётся корень `.` как статика (без служебных и скрытых файлов).
#   • Ручной override (опц.): repo-vars BUILD_CMD (своя команда сборки) и DEPLOY_DIR (своя папка выхлопа).
# SSR (Next.js Node-рантайм, БЕЗ output:'export') статикой не публикуется: в артефакт идёт короткий queued-marker,
# который серверный auto-host-scan заменяет настоящим изолированным container runtime на том же домене.
#
# ЧЕСТНАЯ ГЛАВНАЯ: сборка упала ИЛИ в выхлопе нет index.html → в артефакт кладётся информативная страница с логом
# ошибки вместо пустого 404. Задание `verify` ждёт, пока адрес отдаст метку ЭТОЙ сборки (`/_hov/deploy.json`), и краснеет,
# если сайт не появился или показывает страницу ошибки сборки.
name: Build site for HackOnVibe
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      honest: ${{ steps.detect.outputs.honest }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Detect app & build
        id: detect
        env:
          OVERRIDE_BUILD: ${{ vars.BUILD_CMD }}
          OVERRIDE_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          set -uo pipefail
          # 1) папка приложения: корень или первая подпапка с package.json
          APP_DIR="."
          if [ ! -f package.json ]; then
            for d in */; do
              d="${d%/}"
              case "$d" in .git|.github|node_modules|public|assets) continue;; esac
              if [ -f "$d/package.json" ]; then APP_DIR="$d"; break; fi
            done
          fi
          DEPLOY_DIR="."
          HAS_BUILD=""
          BUILD_FAILED=""
          if [ -n "${OVERRIDE_BUILD}" ] || { [ -f "$APP_DIR/package.json" ] && grep -q '"build"[[:space:]]*:' "$APP_DIR/package.json"; }; then
            HAS_BUILD=1
          fi
          if [ -n "$HAS_BUILD" ]; then
            echo "::notice::сборка приложения в '$APP_DIR' (override='${OVERRIDE_BUILD}')"
            (
              cd "$APP_DIR"
              # CI=false → CRA/react-scripts не валит сборку на warning'ах (хакатон: важно поднять сайт)
              export CI=false
              if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
              if [ -n "${OVERRIDE_BUILD}" ]; then
                eval "${OVERRIDE_BUILD}"
              elif npm run build; then
                echo "::notice::npm run build успешен"
              elif [ -f vite.config.ts ] || [ -f vite.config.js ] || [ -f vite.config.mjs ] || grep -q '"vite"[[:space:]]*:' package.json; then
                # Частая ловушка: build = "tsc -b && vite build"; strict-tsc падает на type-ошибках,
                # но приложение рабочее (Vite/esbuild типы не проверяет). Фолбэк — vite build без типчека.
                echo "::warning::npm run build упал (обычно strict tsc) — фолбэк: vite build без типчека"
                npx --yes vite build
              else
                echo "::error::сборка упала и фолбэка нет"; false
              fi
            ) 2>&1 | tee /tmp/build.log || echo "::warning::сборка упала — уйдёт честная страница с логом"
            # 2) папка выхлопа: override → первая существующая с index.html
            FOUND=""
            if [ -n "${OVERRIDE_DIR}" ]; then
              D="$APP_DIR/${OVERRIDE_DIR}"; [ "$APP_DIR" = "." ] && D="${OVERRIDE_DIR}"
              [ -f "$D/index.html" ] && { DEPLOY_DIR="$D"; FOUND=1; }
            else
              for cand in dist build out .output/public .next-export; do
                if [ -f "$APP_DIR/$cand/index.html" ]; then
                  DEPLOY_DIR="$APP_DIR/$cand"; [ "$APP_DIR" = "." ] && DEPLOY_DIR="$cand"
                  FOUND=1; break
                fi
              done
            fi
            if [ -z "$FOUND" ]; then
              # Фреймворк-сборка НЕ дала выхлопа с index.html → ПРОВАЛ. Сырой репозиторий НЕ деплоим —
              # готовим ЧИСТУЮ папку только под честную страницу-ошибку (её пишет след. шаг). Прогон станет
              # КРАСНЫМ (шаг «Verify the site is really live» — по факту домена). Так публичный сайт показывает «что сломалось», а не битый исходник.
              BUILD_FAILED=1
              DEPLOY_DIR=".hov-ci"; rm -rf "$DEPLOY_DIR"; mkdir -p "$DEPLOY_DIR"
              echo "::warning::сборка не дала выхлопа с index.html → честная страница + красный прогон"
            elif [ ! -f "$DEPLOY_DIR/_redirects" ]; then
              # 3) SPA-fallback (клиентский роутинг): нет _redirects → кладём
              printf '/*    /index.html    200\n' > "$DEPLOY_DIR/_redirects"
              echo "::notice::SPA-fallback _redirects добавлен в $DEPLOY_DIR"
            fi
          else
            echo "::notice::нет package.json+build → деплой '.' как статику"
          fi
          # SSR-детект: Next.js БЕЗ output:'export' и без статического выхлопа = серверный рантайм,
          # Pages его не тянет. На поддомен кладём наблюдаемый маркер ожидания: серверный робот читает его и
          # передаёт этот Next.js проект в изолированный Docker path (auto-host-scan → host-ssr-team.sh).
          SSR=""
          if [ -f "$APP_DIR/package.json" ] && grep -q '"next"[[:space:]]*:' "$APP_DIR/package.json"; then
            NEXTCFG="$(cat "$APP_DIR"/next.config.* 2>/dev/null || true)"
            # Next.js без output:'export' = серверный рантайм (Pages не тянет) → SSR ВСЕГДA,
            # даже если в корне завалялся index.html: деплой на Pages не даст живого SSR-приложения.
            if ! printf '%s' "$NEXTCFG" | grep -qE "output[[:space:]]*:[[:space:]]*['\"]export['\"]"; then
              SSR=1
            fi
          fi
          # Режим сборки (те же ТРИГГЕРЫ детекции — для честной страницы и подсказки команде):
          #   static (нет build-скрипта) / framework (есть build) / ssr (Next без output:'export').
          MODE="static"; [ -n "$HAS_BUILD" ] && MODE="framework"; [ "$SSR" = "1" ] && MODE="ssr"
          # Next SSR нельзя выдавать как статический .next. Чистая marker-page делает первый container-host
          # достижимым для auto-host-scan; это не build failure команды, а очередь серверного runtime.
          if [ "$SSR" = "1" ]; then
            DEPLOY_DIR=".hov-ci"; rm -rf "$DEPLOY_DIR"; mkdir -p "$DEPLOY_DIR"; BUILD_FAILED=""
          fi
          # honest=1 → задеплоили честную страницу (сборка не дала сайт). КРАСНЫЙ решает ФАКТ домена (шаг
          # «Verify live site»), а не это. SSR marker-page — намеренная очередь container runtime → зелёный.
          HONEST=""
          [ -n "$BUILD_FAILED" ] && HONEST=1
          echo "ssr=$SSR" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "honest=$HONEST" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=$DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "::notice::DEPLOY_DIR=$DEPLOY_DIR ssr=${SSR:-no} mode=$MODE honest=${HONEST:-no}"
      - name: Честная главная (страница ошибки при провале сборки / без index.html)
        env:
          DEPLOY_DIR: ${{ steps.detect.outputs.deploy_dir }}
          MODE: ${{ steps.detect.outputs.mode }}
        run: |
          mkdir -p "$DEPLOY_DIR"
          if [ "$MODE" = "ssr" ]; then
            echo "::notice::MODE=ssr → marker-page ожидания изолированного SSR container runtime"
            {
              printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server app — deployed by your team — HackOnVibe</title>'
              printf '%s' '<style>body{font:16px/1.6 system-ui,sans-serif;max-width:52rem;margin:3rem auto;padding:0 1.2rem;color:#222}h1{color:#2c6fbf}code{background:#f0f0f0;padding:2px 6px;border-radius:5px}.card{background:#eef4fb;border:1px solid #d3e2f3;border-radius:12px;padding:1rem 1.3rem;margin:1.2rem 0}.card li{margin:.5rem 0}a{color:#2c6fbf}</style></head><body>'
              printf '%s' '<h1>🔵 SSR container is being prepared</h1>'
              printf '%s' '<p data-ssr-container-state="queued"><b>Build did not produce a live site.</b> This Next.js project needs its server runtime, so HackOnVibe is preparing it in an isolated container.</p>'
              printf '%s' '<div class="card"><p style="margin:0"><b>No build-mode change is needed.</b></p><p>The provisioning robot detects this queue marker, builds the repository with <code>Dockerfile.nextjs-ssr</code>, then replaces this page at the same team domain.</p></div>'
              printf '%s' '<p style="color:#888;margin-top:2rem;font-size:13px">HackOnVibe CI &mdash; waiting for isolated SSR container provisioning.</p></body></html>'
            } > "$DEPLOY_DIR/index.html"
          elif [ -f "$DEPLOY_DIR/index.html" ]; then
            echo "::notice::index.html есть в ${DEPLOY_DIR} — деплоим сайт как есть"
          else
            echo "::warning::в ${DEPLOY_DIR} нет index.html → деплою информативную страницу вместо 404/призрака"
            LOG=""
            [ -f /tmp/build.log ] && LOG="$(tail -c 6000 /tmp/build.log | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
            case "$MODE" in
              ssr) HERE="🔵 Server app";; framework) HERE="🟡 Built app";; *) HERE="🟢 Plain website";; esac
            {
              printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build failed — HackOnVibe</title>'
              printf '%s' '<style>body{font:16px/1.6 system-ui,sans-serif;max-width:56rem;margin:3rem auto;padding:0 1.2rem;color:#222}h1{color:#c0392b}h3{margin-top:1.6rem}code{background:#f0f0f0;padding:2px 6px;border-radius:5px}pre{background:#0d1117;color:#e6edf3;padding:1rem;border-radius:10px;overflow:auto;white-space:pre-wrap;font-size:13px}.fork{background:#f6f8fa;border:1px solid #e2e6ea;border-radius:12px;padding:1rem 1.3rem;margin:1.2rem 0}.fork li{margin:.5rem 0}.here{background:#fff7e6;border-left:4px solid #f0a020;padding:.6rem 1rem;border-radius:6px}</style></head><body>'
              printf '%s' '<h1>⚠️ Build did not produce a live site</h1>'
              printf '%s' '<p>Your latest push did not put a working site online yet. Here is exactly how our system decides to build your site — and how <b>you</b> control it by your files.</p>'
              # ── Развилка билдов (3 режима + триггеры детекции) — для школьников, простым языком ──
              printf '%s' '<div class="fork"><h3>3 ways we can build your site — we pick automatically from your files:</h3><ul>'
              printf '%s' '<li>🟢 <b>Plain website</b> — if there is <b>no <code>build</code> script</b> in <code>package.json</code> (or no <code>package.json</code>), we put your files online exactly as they are, so your <code>index.html</code> shows up.</li>'
              printf '%s' '<li>🟡 <b>Built app</b> — if <code>package.json</code> has a <b><code>build</code></b> script for a static tool (React/Vite/Astro, or Next.js with <code>output:&#39;export&#39;</code>), we run the build and publish the built folder (<code>dist</code>/<code>build</code>/<code>out</code>).</li>'
              printf '%s' '<li>🔵 <b>Server app</b> — if it is <b>Next.js with a <code>build</code> but no <code>output:&#39;export&#39;</code></b> (or a Node/Express backend), it needs a live server. <b>HackOnVibe hosts static sites only</b> &mdash; deploy the server yourself on <b>Vercel</b> (or Render/Railway/Fly) and paste your live link in your <a href="https://hackonvibe.com/me">/me</a> cabinet, so judges open the right site.</li>'
              printf '%s' '</ul>'
              printf '<p class="here"><b>Right now your repo is in: %s.</b> To switch: <b>delete the <code>build</code> script</b> → 🟢 Plain website · <b>add <code>output:&#39;export&#39;</code></b> → 🟡 Built app · <b>keep the server + deploy it on Vercel, link in /me</b> → 🔵 Server app.</p>' "$HERE"
              printf '%s' '</div>'
              if [ -n "$LOG" ]; then
                printf '%s' '<p>The build command <b>failed</b> — the exact error is below. Fix it (or switch build mode above), then push to <code>main</code> again — the site rebuilds automatically.</p><h3>Build log (last lines):</h3><pre>'
                printf '%s' "$LOG"
                printf '%s' '</pre>'
              else
                printf '%s' '<p>No build output was produced. Pick the build mode you want above and push to <code>main</code> again.</p>'
              fi
              printf '%s' '<p style="color:#888;margin-top:2rem;font-size:13px">HackOnVibe CI — this page auto-replaces a broken deploy so you can see exactly what went wrong.</p></body></html>'
            } > "$DEPLOY_DIR/index.html"
          fi
      - name: Package the site (static files only)
        env:
          DEPLOY_DIR: ${{ steps.detect.outputs.deploy_dir }}
        run: |
          set -euo pipefail
          # В артефакт идёт ТОЛЬКО статика: без скрытых файлов и каталогов, node_modules, серверных файлов Cloudflare
          # (functions, _worker.js, _routes.json, wrangler.*) и служебных _headers/_redirects/_hov — их ставит платформа.
          # Символьные ссылки пропускаются. Сервер всё равно проверяет архив заново: этот шаг лишь помогает не споткнуться.
          OUT="${RUNNER_TEMP}/hov-site"
          rm -rf "$OUT"; mkdir -p "$OUT"
          rsync -rt --no-links \
            --exclude='.*' --exclude='node_modules' --exclude='/functions' --exclude='/_worker.js' --exclude='/_routes.json' \
            --exclude='wrangler.*' --exclude='/_headers' --exclude='/_redirects' --exclude='/_hov' \
            "${DEPLOY_DIR}"/ "$OUT"/
          test -f "$OUT/index.html" || { echo "::error::в сайте нет index.html"; exit 1; }
          echo "::notice::в артефакт hov-site: $(find "$OUT" -type f | wc -l) файлов, $(du -sh "$OUT" | cut -f1)"
      - name: Upload the site (HackOnVibe publishes it)
        uses: actions/upload-artifact@v4
        with:
          name: hov-site
          path: ${{ runner.temp }}/hov-site
          if-no-files-found: error
          retention-days: 1
      - name: On failure — open/update a GitHub issue (team sees the error at once)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DIAG=$'The **build step failed** before a site could be handed to HackOnVibe. Open the run log, fix the error and push to `main` again.'
          LOG=""
          [ -f /tmp/build.log ] && LOG="$(tail -c 3500 /tmp/build.log)"
          BODY="$(printf '🚨 **Automatic deploy failed** — your live site was NOT updated.\n\n**Failed at:** Build (compiling your project)\n**CI run:** %s\n\n%s\n\n<details><summary>Build log (tail)</summary>\n\n```\n%s\n```\n</details>\n\n---\nFix the cause and **push a new commit to `main`** — the deploy re-runs automatically and this issue closes itself once it succeeds.\n_(HackOnVibe CI — automatic notification)_' "$RUN_URL" "$DIAG" "$LOG")"
          TITLE="🚨 Deployment failed — action needed"
          NUM="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Deployment failed' --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY" && echo "::notice::обновил Issue #$NUM"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label "" 2>/dev/null \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "::notice::создал Issue о падении деплоя"
          fi
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_HOST: ${{ github.event.repository.name }}.hackonvibe.com
      MODE: ${{ needs.build.outputs.mode }}
    steps:
      # ── ЧЕСТНЫЙ сигнал ПО ФАКТУ: адрес показывает ЭТУ сборку, а не прошлую или страницу-ошибку? ──
      # Платформа кладёт в сайт метку `/_hov/deploy.json` с SHA коммита: совпал SHA — сборка опубликована. Красный ⇔ метка
      # не появилась за отведённое время ИЛИ адрес отдаёт честную страницу ошибки сборки. Заглушка SSR (queued) — зелёный.
      - name: Verify the site is really live (fact — red if the address does not show this build)
        run: |
          set -u
          SEEN=""
          # До ~12 минут: первая выкладка нового адреса дольше (проект, домен, сертификат), обычная — минуты.
          for i in $(seq 1 80); do
            SEEN="$(curl -s --max-time 4 "https://${SITE_HOST}/_hov/deploy.json?cihb=${i}${RANDOM}" | jq -r '.sha // empty' 2>/dev/null || true)"
            [ "$SEEN" = "$GITHUB_SHA" ] && break
            sleep 5
          done
          if [ "$SEEN" != "$GITHUB_SHA" ]; then
            echo "::error::Сайт НЕ опубликован — https://${SITE_HOST} не показывает сборку ${GITHUB_SHA}. Публикует платформа HackOnVibe: статус смотрите в кабинете команды (https://hackonvibe.com/me). Прогон КРАСНЫЙ."
            exit 1
          fi
          BODY="$(curl -s --max-time 10 "https://${SITE_HOST}/?cihb=${RANDOM}" || true)"
          if [ "$MODE" = "ssr" ] && printf '%s' "$BODY" | grep -q 'data-ssr-container-state="queued"'; then
            echo "::notice::✓ SSR container provisioning queued: https://${SITE_HOST}"
            exit 0
          fi
          if printf '%s' "$BODY" | grep -q "Build did not produce a live site"; then
            echo "::error::Сборка не дала сайт — адрес показывает страницу-ошибку сборки (лог на ней). Прогон КРАСНЫЙ."
            exit 1
          fi
          echo "::notice::✓ живой сайт: https://${SITE_HOST}"
      # ── Провал → команда видит ошибку СРАЗУ в своём GitHub Issue ──
      - name: On failure — open/update a GitHub issue (team sees the error at once)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HONEST: ${{ needs.build.outputs.honest }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # honest=1 → сборка не дала сайт (опубликована честная страница). Иначе платформа ещё не опубликовала сборку.
          if [ "${HONEST}" = "1" ]; then
            STAGE="Build (compiling your project)"
            DIAG=$'The **build failed** — it produced no site. Your live domain now shows an honest error page (not your broken code). Fix the errors in the log below and push to `main` again.'
          else
            STAGE="Publish (HackOnVibe puts your build online)"
            DIAG=$'The **build succeeded**, but your site did not show the new build in time. Publishing is done by the HackOnVibe platform, not by this workflow: check the status in your team cabinet (https://hackonvibe.com/me) — publishing may be paused or the build refused. **Do not edit `.github/workflows/deploy.yml`** — it is managed centrally; just push your app code.'
          fi
          BODY="$(printf '🚨 **Automatic deploy failed** — your live site was NOT updated.\n\n**Failed at:** %s\n**CI run:** %s\n\n%s\n\n---\nFix the cause and **push a new commit to `main`** — the deploy re-runs automatically and this issue closes itself once it succeeds.\n_(HackOnVibe CI — automatic notification)_' "$STAGE" "$RUN_URL" "$DIAG")"
          TITLE="🚨 Deployment failed — action needed"
          NUM="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Deployment failed' --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY" && echo "::notice::обновил Issue #$NUM"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label "" 2>/dev/null \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "::notice::создал Issue о падении деплоя"
          fi
      - name: On success — close the failure issue if it was open
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Deployment failed — action needed"
          for NUM in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title Deployment failed' --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number"); do
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "✅ Deploy succeeded again — your live site is updated. Closing this issue." || true
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" || true
            echo "::notice::закрыл Issue #$NUM (деплой снова зелёный)"
          done
